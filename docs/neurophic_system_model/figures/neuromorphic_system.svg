  <path class="wire" d="M 1730 576 L 1747.0 552 L 1764.0 600 L 1781.0 552 L 1798.0 600 L 1815.0 552 L 1832.0 600 L 1849.0 552 L 1866.0 600 L 1883.0 552 L 1900 576"/>
