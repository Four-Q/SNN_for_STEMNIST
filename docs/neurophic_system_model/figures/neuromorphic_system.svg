  <rect x="776" y="828" width="183" height="16" rx="8" fill="#dbe8eb"/>
  <rect x="776" y="828" width="103" height="16" rx="8" fill="#7cbac4"/>
  <path class="guide" d="M 975 708 C 952 666 916 618 861 567"/>

  <!-- TIA -->
  <rect x="1040" y="405" width="288" height="286" rx="21" class="module" filter="url(#soft-shadow)"/>
  <rect x="1040" y="405" width="288" height="58" rx="18" class="fill-blue"/>
  <rect x="1040" y="445" width="288" height="18" class="fill-blue"/>
  <text x="1184" y="444" text-anchor="middle" font-size="28" font-weight="800" style="fill:#ffffff">TIA</text>
