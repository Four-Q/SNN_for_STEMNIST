  <text x="1122" y="558" class="label">−</text>
  <text x="1122" y="617" class="label">+</text>
  <line class="wire-thin" x1="1060" y1="550" x2="1105" y2="550"/>
  <line class="wire-thin" x1="1060" y1="608" x2="1105" y2="608"/>
  <line class="wire-thin" x1="1060" y1="608" x2="1060" y2="635"/>
  <line class="wire-thin" x1="1041" y1="635" x2="1079" y2="635"/>
