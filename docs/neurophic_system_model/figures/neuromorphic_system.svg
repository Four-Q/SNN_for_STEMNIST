  <text x="1455" y="558" class="label">−</text>
  <text x="1455" y="617" class="label">+</text>
  <line class="wire-thin" x1="1398" y1="608" x2="1438" y2="608"/>
  <line class="wire" x1="1580" y1="576" x2="1730" y2="576"/>
  <text x="1518" y="482" text-anchor="middle" class="tiny">R<tspan baseline-shift="sub" font-size="11">in2</tspan> = R<tspan baseline-shift="sub" font-size="11">f2</tspan> = 10 kΩ</text>
  <path class="wire-thin" d="M 1614 576 L 1614 490 L 1460 490 L 1460 550"/>
  <path d="M 1510 490 L 1518.8 480 L 1527.5 500 L 1536.3 480 L 1545.0 500 L 1553.8 480 L 1562.5 500 L 1571.3 480 L 1580 490" fill="none" stroke="#496f95" stroke-width="4" stroke-linejoin="round"/>
  <line x1="1410" y1="608" x2="1390" y2="608" stroke="#26313b" stroke-width="3"/>
  <circle cx="1402" cy="608" r="6" class="fill-blue"/>
  <text x="1518" y="653" text-anchor="middle" class="tiny">V<tspan baseline-shift="sub" font-size="11">REF</tspan> = 0.75 V · rails ±5 V</text>
  <text x="1693" y="545" text-anchor="middle" class="formula">V<tspan baseline-shift="sub" font-size="14">DRIVE</tspan></text>
  <rect x="1378" y="719" width="280" height="116" rx="14" class="fill-blue-light"/>
  <text x="1518" y="756" text-anchor="middle" class="formula">V<tspan baseline-shift="sub" font-size="14">DRIVE</tspan> = 2V<tspan baseline-shift="sub" font-size="14">REF</tspan> − V<tspan baseline-shift="sub" font-size="14">TIA</tspan></text>
  <text x="1518" y="799" text-anchor="middle" class="formula">= 1.5 V − V<tspan baseline-shift="sub" font-size="14">TIA</tspan></text>

