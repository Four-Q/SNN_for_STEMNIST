    <line class="wire" x1="488" y1="826" x2="488" y2="850"/>
    <text x="444" y="638" text-anchor="end" class="label">NbOₓ TS</text>
    <text x="444" y="665" text-anchor="end" class="small">volatile threshold switch</text>
  <line class="wire" x1="602" y1="440" x2="602" y2="515"/>
  
    <line class="wire" x1="602" y1="440" x2="602" y2="497"/>
    <line class="wire" x1="572" y1="497" x2="632" y2="497"/>
    <line class="wire" x1="572" y1="533" x2="632" y2="533"/>
    <line class="wire" x1="602" y1="533" x2="602" y2="850"/>
