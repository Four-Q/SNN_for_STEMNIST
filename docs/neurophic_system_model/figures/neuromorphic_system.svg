<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1200" viewBox="0 0 2400 1200" role="img">

  <defs>
    <marker id="arrow-dark" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#26313b"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#25889a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#dc6843"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1d2933" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; fill: #26313b; }
      .title { font-size: 42px; font-weight: 800; letter-spacing: -0.6px; }
      .subtitle { font-size: 20px; fill: #637080; }
      .section { font-size: 25px; font-weight: 800; letter-spacing: 0.8px; }
      .label { font-size: 22px; font-weight: 600; }
      .body { font-size: 20px; }
      .small { font-size: 17px; fill: #566576; }
      .tiny { font-size: 15px; fill: #667687; }
      .formula { font-family: "Times New Roman", Times, serif; font-size: 20px; font-style: italic; }
      .wire { fill: none; stroke: #26313b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .wire-thin { fill: none; stroke: #26313b; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .guide { fill: none; stroke: #9aabba; stroke-width: 2.5; stroke-dasharray: 8 9; }
      .orange { stroke: #dc6843; }
      .teal { stroke: #25889a; }
      .blue { stroke: #496f95; }
      .fill-orange { fill: #dc6843; }
      .fill-orange-light { fill: #f9e6df; }
      .fill-teal { fill: #25889a; }
      .fill-teal-light { fill: #e1f1f3; }
      .fill-blue { fill: #496f95; }
      .fill-blue-light { fill: #e8eef4; }
      .fill-ink { fill: #26313b; }
      .fill-muted { fill: #eef2f5; }
      .node { fill: #26313b; }
      .card { fill: #ffffff; stroke: #d8e0e7; stroke-width: 2.5; }
      .module { fill: #ffffff; stroke: #496f95; stroke-width: 4; }
      .callout { fill: #fbfcfd; stroke: #c9d4dd; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="2400" height="1200" fill="#ffffff"/>
  
  <text x="70" y="70" class="title">Neuromorphic electronic system</text>
  <text x="70" y="108" class="subtitle">Simulation-faithful functional schematic derived from System_with_TIA.asc</text>

  
    <text x="70" y="154" class="section">PRESYNAPTIC NbOₓ NEURON</text>
    <line x1="70" y1="174" x2="225" y2="174" stroke="#dc6843" stroke-width="8" stroke-linecap="round"/>
  
    <text x="700" y="154" class="section">DYNAMIC SYNAPSE</text>
    <line x1="700" y1="174" x2="855" y2="174" stroke="#25889a" stroke-width="8" stroke-linecap="round"/>
  
    <text x="1040" y="154" class="section">ANALOG INTERFACE</text>
    <line x1="1040" y1="174" x2="1195" y2="174" stroke="#496f95" stroke-width="8" stroke-linecap="round"/>
  
    <text x="1690" y="154" class="section">POSTSYNAPTIC NbOₓ NEURON</text>
    <line x1="1690" y1="174" x2="1845" y2="174" stroke="#dc6843" stroke-width="8" stroke-linecap="round"/>

  <!-- PWL input -->
  <text x="78" y="330" class="label">Input spike train</text>
  <text x="106" y="364" class="formula">V<tspan baseline-shift="sub" font-size="14">in</tspan>(t)</text>
  <circle cx="128" cy="532" r="57" fill="#ffffff" stroke="#26313b" stroke-width="5"/>
  <path d="M 91 540 L 105 540 L 105 510 L 123 510 L 123 550 L 143 550 L 143 520 L 165 520" fill="none" stroke="#dc6843" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
