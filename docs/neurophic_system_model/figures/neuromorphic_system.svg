  <text x="543" y="313" text-anchor="middle" class="small" font-weight="700">Threshold hysteresis</text>
  <text x="543" y="340" text-anchor="middle" class="small">V<tspan baseline-shift="sub" font-size="12">H</tspan> = 1.676 V · V<tspan baseline-shift="sub" font-size="12">L</tspan> = 1.127 V</text>

  <!-- Synaptic transistor -->
  <line class="wire" x1="645" y1="440" x2="760" y2="440"/>
  <line class="wire" x1="760" y1="400" x2="760" y2="530"/>
  <text x="742" y="422" text-anchor="end" class="label">G</text>
