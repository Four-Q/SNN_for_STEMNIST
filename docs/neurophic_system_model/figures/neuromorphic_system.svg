  <line class="wire-thin" x1="1055" y1="657" x2="1065" y2="657"/>
  <line class="wire-thin" x1="1247" y1="576" x2="1308" y2="576"/>
  <path class="wire-thin" d="M 1282 576 L 1282 490 L 1090 490 L 1090 550"/>
  <path d="M 1160 490 L 1170.9 479 L 1181.8 501 L 1192.6 479 L 1203.5 501 L 1214.4 479 L 1225.3 501 L 1236.1 479 L 1247 490" fill="none" stroke="#496f95" stroke-width="4" stroke-linejoin="round"/>
  <line x1="1112" y1="490" x2="1112" y2="480" stroke="#496f95" stroke-width="3"/>
  <line x1="1129" y1="477" x2="1129" y2="503" stroke="#496f95" stroke-width="3"/>
  <text x="1200" y="482" text-anchor="middle" class="tiny">R<tspan baseline-shift="sub" font-size="11">f1</tspan> = 2.5 kΩ ∥ C<tspan baseline-shift="sub" font-size="11">f1</tspan> = 10 nF</text>
  <text x="1184" y="662" text-anchor="middle" class="tiny">op-amp rails: ±5 V</text>
  <path class="wire" d="M 1308 576 L 1360 576 L 1360 550 L 1438 550"/>
  <circle class="node" cx="1354" cy="576" r="9"/>
  <text x="1354" y="545" text-anchor="middle" class="formula">V<tspan baseline-shift="sub" font-size="14">TIA</tspan></text>
  <rect x="1038" y="719" width="293" height="116" rx="14" class="fill-blue-light"/>
  <text x="1184" y="756" text-anchor="middle" class="formula">Z<tspan baseline-shift="sub" font-size="14">f</tspan>(s) = R<tspan baseline-shift="sub" font-size="14">f1</tspan> / (1 + sR<tspan baseline-shift="sub" font-size="14">f1</tspan>C<tspan baseline-shift="sub" font-size="14">f1</tspan>)</text>
  <text x="1184" y="799" text-anchor="middle" class="formula">V<tspan baseline-shift="sub" font-size="14">TIA</tspan>(s) = −I<tspan baseline-shift="sub" font-size="14">syn</tspan>(s) Z<tspan baseline-shift="sub" font-size="14">f</tspan>(s)</text>

  <!-- Level shifter -->
  <rect x="1380" y="405" width="276" height="286" rx="21" class="module" filter="url(#soft-shadow)"/>
