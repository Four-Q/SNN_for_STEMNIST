  <line class="wire" x1="488" y1="850" x2="488" y2="905"/>
  <line class="wire" x1="602" y1="850" x2="602" y2="905"/>
  <rect x="232" y="706" width="178" height="132" rx="13" class="callout"/>
  <text x="321" y="733" text-anchor="middle" class="small" font-weight="700">NbOₓ MIM stack</text>
