  <path d="M 380 624 C 427 657 488 659 538 626" fill="none" stroke="#9aabba" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <text x="458" y="694" text-anchor="middle" class="small">threshold → action potential</text>
  
    <path d="M 610 389 l 14.76 0 l 6.56 -26.24 l 9.02 50.839999999999996 l 9.84 -41 l 7.38 16.4 l 18.04 0" fill="none" stroke="#dc6843" stroke-width="3.69" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="674" y="349" text-anchor="middle" class="small">presynaptic spike</text>

