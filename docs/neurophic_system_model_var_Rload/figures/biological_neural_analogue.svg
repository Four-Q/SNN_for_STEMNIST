  <text x="1859" y="521" text-anchor="middle" class="small">threshold firing</text>
  <text x="2027" y="585" text-anchor="middle" class="small">axon hillock</text>
  
    <path d="M 2144 418 l 16.2 0 l 7.2 -28.8 l 9.9 55.800000000000004 l 10.8 -45 l 8.1 18 l 19.8 0" fill="none" stroke="#dc6843" stroke-width="4.05" stroke-linecap="round" stroke-linejoin="round"/>
