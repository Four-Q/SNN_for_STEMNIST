  <rect width="2400" height="1200" fill="#ffffff"/>
  
  <text x="70" y="70" class="title">Biological neural analogue</text>
  <text x="70" y="108" class="subtitle">Functional correspondence to the neuromorphic circuit — not structural homology</text>

  
    <text x="70" y="154" class="section">PRESYNAPTIC NEURON</text>
    <line x1="70" y1="174" x2="225" y2="174" stroke="#dc6843" stroke-width="8" stroke-linecap="round"/>
  
    <text x="700" y="154" class="section">CHEMICAL SYNAPSE</text>
    <line x1="700" y1="174" x2="855" y2="174" stroke="#25889a" stroke-width="8" stroke-linecap="round"/>
  
    <text x="1040" y="154" class="section">DENDRITIC INTEGRATION</text>
    <line x1="1040" y1="174" x2="1195" y2="174" stroke="#496f95" stroke-width="8" stroke-linecap="round"/>
  
    <text x="1800" y="154" class="section">POSTSYNAPTIC NEURON</text>
    <line x1="1800" y1="174" x2="1955" y2="174" stroke="#dc6843" stroke-width="8" stroke-linecap="round"/>

