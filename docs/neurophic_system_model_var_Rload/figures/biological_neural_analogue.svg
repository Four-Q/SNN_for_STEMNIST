  <text x="959" y="673" text-anchor="middle" class="small">neurotransmitter · cleft · receptors</text>
  <rect x="714" y="742" width="300" height="110" rx="16" class="fill-teal-light"/>
  <text x="864" y="777" text-anchor="middle" class="small" font-weight="700">Synaptic conductance dynamics</text>
  <text x="864" y="813" text-anchor="middle" class="body">slow · fast · medium kinetics</text>
  <path class="guide" d="M 892 742 C 908 697 923 649 942 600"/>

