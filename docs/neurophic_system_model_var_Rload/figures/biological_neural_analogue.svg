  <path d="M 1041 382 C 1021 359 1008 337 1001 312 M 1217 372 C 1233 343 1246 319 1265 297 M 1215 614 C 1195 641 1183 666 1176 694 M 1494 615 C 1513 646 1527 666 1552 686 M 1620 413 C 1641 386 1651 357 1656 329" fill="none" stroke="#496f95" stroke-width="6" stroke-linecap="round"/>

