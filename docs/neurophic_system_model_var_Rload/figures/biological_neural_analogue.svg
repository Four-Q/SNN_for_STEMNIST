  <text x="2260" y="603" text-anchor="middle" class="formula">V<tspan baseline-shift="sub" font-size="14">out</tspan>(t)</text>

  <!-- Biological process labels -->
  <rect x="278" y="759" width="342" height="92" rx="16" class="fill-orange-light"/>
  <text x="449" y="795" text-anchor="middle" class="small" font-weight="700">Presynaptic computation</text>
  <text x="449" y="827" text-anchor="middle" class="body">integrate → threshold → fire</text>
  <path class="guide" d="M 449 759 C 453 707 456 653 457 609"/>
  <rect x="1751" y="738" width="430" height="113" rx="16" class="fill-orange-light"/>
  <text x="1966" y="775" text-anchor="middle" class="small" font-weight="700">Postsynaptic spike generation</text>
  <text x="1966" y="808" text-anchor="middle" class="body">EPSP crosses threshold at the axon hillock</text>
  <path class="guide" d="M 1956 738 C 1980 670 2010 612 2041 563"/>

  <!-- Signal flow and legend -->
  <path d="M 126 966 L 2290 966" fill="none" stroke="#aab7c2" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <text x="1200" y="949" text-anchor="middle" class="small">information flow</text>
  <rect x="635" y="1028" width="16" height="16" rx="3" class="fill-orange"/>
  <text x="662" y="1043" class="small">excitable neuron</text>
  <rect x="912" y="1028" width="16" height="16" rx="3" class="fill-teal"/>
  <text x="939" y="1043" class="small">chemical synapse</text>
  <rect x="1190" y="1028" width="16" height="16" rx="3" class="fill-blue"/>
  <text x="1217" y="1043" class="small">postsynaptic integration and bias</text>
  <text x="70" y="1124" class="tiny">Functional mapping: NbOₓ oscillators emulate excitable firing; the analog interface emulates membrane-level signal processing, not a distinct anatomical organ.</text>
</svg>