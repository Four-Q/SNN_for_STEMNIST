    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1d2933" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; fill: #26313b; }
      .title { font-size: 42px; font-weight: 800; letter-spacing: -0.6px; }
      .subtitle { font-size: 20px; fill: #637080; }
      .section { font-size: 25px; font-weight: 800; letter-spacing: 0.8px; }
      .label { font-size: 22px; font-weight: 600; }
      .body { font-size: 20px; }
      .small { font-size: 17px; fill: #566576; }
      .tiny { font-size: 15px; fill: #667687; }
      .formula { font-family: "Times New Roman", Times, serif; font-size: 20px; font-style: italic; }
      .wire { fill: none; stroke: #26313b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .wire-thin { fill: none; stroke: #26313b; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .guide { fill: none; stroke: #9aabba; stroke-width: 2.5; stroke-dasharray: 8 9; }
      .orange { stroke: #dc6843; }
      .teal { stroke: #25889a; }
      .blue { stroke: #496f95; }
      .fill-orange { fill: #dc6843; }
      .fill-orange-light { fill: #f9e6df; }
      .fill-teal { fill: #25889a; }
      .fill-teal-light { fill: #e1f1f3; }
      .fill-blue { fill: #496f95; }
      .fill-blue-light { fill: #e8eef4; }
      .fill-ink { fill: #26313b; }
      .fill-muted { fill: #eef2f5; }
      .node { fill: #26313b; }
      .card { fill: #ffffff; stroke: #d8e0e7; stroke-width: 2.5; }
      .module { fill: #ffffff; stroke: #496f95; stroke-width: 4; }
      .callout { fill: #fbfcfd; stroke: #c9d4dd; stroke-width: 2.5; }
    </style>
