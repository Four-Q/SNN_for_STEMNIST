  <text x="1114" y="788" class="formula">I<tspan baseline-shift="sub" font-size="14">syn</tspan></text>
  <line x1="1170" y1="752" x2="1170" y2="838" stroke="#26313b" stroke-width="4"/>
  <line x1="1145" y1="774" x2="1195" y2="774" stroke="#26313b" stroke-width="4"/>
  <line x1="1145" y1="797" x2="1195" y2="797" stroke="#26313b" stroke-width="4"/>
  <path d="M 1230 792 L 1237.0 782 L 1244.0 802 L 1251.0 782 L 1258.0 802 L 1265.0 782 L 1272 792" fill="none" stroke="#496f95" stroke-width="4"/>
  <text x="1208" y="846" text-anchor="middle" class="small">membrane RC</text>
  <text x="1185" y="869" text-anchor="middle" class="tiny">current → EPSP · integration · decay</text>
  <path class="guide" d="M 1185 686 C 1180 628 1182 563 1190 493"/>

  <!-- Level-shift functional analogue callout -->
  <rect x="1372" y="686" width="288" height="196" rx="20" class="module" filter="url(#soft-shadow)"/>
  <text x="1516" y="724" text-anchor="middle" class="label">Excitability bias</text>
  <path d="M 1418 814 C 1452 814 1465 760 1496 760 C 1527 760 1541 814 1581 814" fill="none" stroke="#496f95" stroke-width="4"/>
  <line x1="1418" y1="820" x2="1584" y2="820" stroke="#9aabba" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="1500" y1="744" x2="1500" y2="839" stroke="#dc6843" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="1516" y="846" text-anchor="middle" class="small">resting potential · gain · polarity</text>
  <text x="1516" y="870" text-anchor="middle" class="tiny">sets depolarization relative to threshold</text>
  <path class="guide" d="M 1515 686 C 1516 630 1530 555 1550 488"/>

  <!-- Postsynaptic soma, hillock and axon -->
  <path d="M 1710 522 C 1728 487 1736 448 1766 419 C 1803 383 1871 377 1920 402 C 1970 427 1983 485 1968 533 C 1955 578 1910 608 1865 610 C 1813 613 1750 580 1710 522 Z" fill="#fff8f5" stroke="#dc6843" stroke-width="10"/>
  <circle cx="1858" cy="496" r="45" fill="#f2c8b9" opacity="0.65"/>
  <path d="M 1965 502 C 2009 484 2042 487 2076 509 C 2114 534 2131 533 2170 531 C 2203 529 2235 532 2280 532" fill="none" stroke="#dc6843" stroke-width="15" stroke-linecap="round"/>
